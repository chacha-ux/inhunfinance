# =====================================================
# Jekyll 사이트 설정 — Just the Docs 테마
# =====================================================

title: 청소년 금융교육 길잡이
description: 서울대학교 글로벌사회공헌단 사회공헌활동 — 인헌중학교 금융교육 프로젝트
remote_theme: just-the-docs/just-the-docs

# -----------------------------------------------------
# IMPORTANT: GitHub Pages에 올릴 때
#  - 만약 저장소 이름이 "username.github.io" 라면 baseurl 을 비워두세요.
#  - 만약 저장소 이름이 다른 이름이라면 (예: finance-edu),
#    baseurl 을 "/finance-edu" 처럼 저장소 이름으로 설정하세요.
# -----------------------------------------------------
url: ""
baseurl: ""

permalink: pretty

# -----------------------------------------------------
# 검색 기능
# -----------------------------------------------------
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# -----------------------------------------------------
# 외관
# -----------------------------------------------------
color_scheme: light
heading_anchors: true

# 좌측 사이드바 상단의 외부 링크
nav_external_links:
  - title: 사이버범죄 신고 (ECRM)
    url: https://ecrm.police.go.kr
    hide_icon: false

# 푸터 문구
footer_content: >-
  © 2026 서울대학교 글로벌사회공헌단 인헌중학교 금융교육팀 ·
  본 사이트의 내용은 교육 목적의 참고 자료입니다.

# -----------------------------------------------------
# Mermaid 다이어그램 지원
# -----------------------------------------------------
mermaid:
  version: "10.6.1"

# -----------------------------------------------------
# 플러그인
# -----------------------------------------------------
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# -----------------------------------------------------
# 빌드에서 제외할 파일
# -----------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .gitignore

# -----------------------------------------------------
# 컬렉션 / 기본값
# -----------------------------------------------------
defaults:
  - scope:
      path: ""
    values:
      layout: default
