# =====================================================
# Jekyll 사이트 설정 — Just the Docs 테마
# =====================================================

title: 청소년 금융교육 길잡이
description: 서울대학교 글로벌사회공헌단 사회공헌활동 — 인헌중학교 금융교육 프로젝트
remote_theme: just-the-docs/just-the-docs

# -----------------------------------------------------
# 사이트 주소 설정
#   https://chacha-ux.github.io/inhunfinance/  에 맞춤
# -----------------------------------------------------
url: "https://chacha-ux.github.io"
baseurl: "/inhunfinance"

permalink: pretty

# -----------------------------------------------------
# 검색 기능
# -----------------------------------------------------
search_enabled: false
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# -----------------------------------------------------
# 외관
# -----------------------------------------------------
color_scheme: light
heading_anchors: true

# 푸터 문구
footer_content: >-
  © 2026 서울대학교 글로벌사회공헌단 인헌중학교 금융교육팀<br>
  본 사이트의 내용은 교육 목적의 참고 자료이며, 외부 자료의 저작권은 각 출처에 있습니다.

# -----------------------------------------------------
# Mermaid 다이어그램 지원
# -----------------------------------------------------
mermaid:
  version: "10.6.1"

# -----------------------------------------------------
# 플러그인
# -----------------------------------------------------
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# -----------------------------------------------------
# 빌드에서 제외할 파일
# -----------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .gitignore

defaults:
  - scope:
      path: ""
    values:
      layout: default
